<meta charset="utf-8" />

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #fcfcfa;
    --ink: #16160f;
    --body: #2c2c26;
    --muted: #6d6d64;
    --faint: #9b9b92;
    --line: #e6e5df;
    --rule: #d8d7cf;
    --paper: #f3f2ec;
    --link: #2a4fd0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --pad: 32px;
  }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 84px; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  img { display: block; max-width: 100%; height: auto; }

  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding-left: var(--pad);
    padding-right: var(--pad);
  }

  /* ---------------- 顶栏 ---------------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(252, 252, 250, 0.9);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top .shell {
    display: flex;
    align-items: center;
    gap: 28px;
    height: 60px;
  }
  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .brand span {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--faint);
    letter-spacing: 0.1em;
    margin-left: 10px;
  }
  .top .back {
    margin-left: auto;
    font-size: 13.5px;
    color: var(--muted);
  }
  .top .back:hover { color: var(--ink); }
  .cv {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--body);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 5px 12px;
    transition: border-color 180ms ease, color 180ms ease;
  }
  .cv:hover { border-color: var(--ink); color: var(--ink); }

  /* ---------------- 首屏 ---------------- */
  .hero { padding-top: 76px; padding-bottom: 46px; }
  .kicker {
    margin: 0 0 26px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .kicker .sep { padding: 0 10px; color: var(--rule); }
  .hero h1 {
    margin: 0 0 22px;
    font-size: clamp(34px, 6vw, 64px);
    line-height: 1.04;
    letter-spacing: -0.035em;
    font-weight: 700;
    color: var(--ink);
  }
  .hero .lead {
    margin: 0;
    max-width: 40em;
    font-size: 16.5px;
    color: var(--body);
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin: 40px 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--line);
  }
  .stats li {
    flex: 1 1 140px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .stats b {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stats span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--faint);
  }

  /* ---------------- 分区 ---------------- */
  .section { padding: 22px 0 40px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 22px;
    padding-top: 34px;
    border-top: 1px solid var(--rule);
  }
  .section-head .no {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: var(--faint);
  }
  .section-head h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .section-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
  }

  /* ---------------- 证书墙 ---------------- */
  .wall {
    column-count: 3;
    column-gap: 22px;
    margin: 26px 0 0;
  }
  .cert {
    display: block;
    break-inside: avoid;
    page-break-inside: avoid;
    margin: 0 0 26px;
  }
  .cert figure { margin: 0; }
  .cert .frame {
    padding: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    transition: border-color 200ms ease, background 200ms ease;
  }
  .cert img {
    width: 100%;
    height: auto;
    background: #fff;
    transition: opacity 200ms ease;
  }
  .cert:hover .frame { border-color: var(--rule); background: #efeee7; }
  .cert figcaption {
    display: block;
    margin-top: 11px;
  }
  .cert .meta {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--faint);
    margin-bottom: 5px;
  }
  .cert strong {
    display: block;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: pretty;
  }
  .cert .note {
    display: block;
    margin-top: 3px;
    font-size: 13px;
    color: var(--muted);
  }
  .cert .tag {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--body);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 7px;
  }
  .cert .tag.nat { color: var(--ink); border-color: var(--rule); }

  /* ---------------- 页脚 ---------------- */
  .foot {
    margin-top: 30px;
    padding: 44px 0 72px;
    border-top: 1px solid var(--rule);
  }
  .foot-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px 32px;
  }
  .foot a.mail {
    font-size: clamp(18px, 2.4vw, 24px);
    letter-spacing: -0.02em;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
  }
  .foot a.mail:hover { border-color: var(--ink); }
  .foot .back { font-size: 14px; color: var(--muted); }
  .foot .back:hover { color: var(--ink); }
  .colophon {
    margin: 34px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--faint);
  }

  /* ---------------- 响应式 ---------------- */
  @media (max-width: 900px) {
    .wall { column-count: 2; column-gap: 18px; }
    .hero { padding-top: 56px; }
  }
  @media (max-width: 620px) {
    :root { --pad: 20px; }
    .top .shell { height: 56px; gap: 14px; }
    .brand span { display: none; }
    .wall { column-count: 1; }
    .section-head { flex-wrap: wrap; gap: 6px 16px; }
    .section-head .n { margin-left: 0; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition-duration: 0.01ms !important; }
  }

  @media print {
    .top { position: static; }
    .wall { column-count: 2; }
    .cert { margin-bottom: 18pt; }
  }
</style>
</head>
